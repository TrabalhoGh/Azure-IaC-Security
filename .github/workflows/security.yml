
name: Azure IaC Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.4.2

      - name: Scan Terraform security
        run: checkov -d . --framework terraform --compact --soft-fail-on CKV_AZURE_33,CKV_AZURE_206,CKV2_AZURE_33,CKV2_AZURE_1
